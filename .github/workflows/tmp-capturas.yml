name: tmp-capturas
on:
  push:
    branches: [ci/capturas-tmp]
permissions:
  contents: write
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python tools/capturas.py
      - shell: bash
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan capturas-out
          git rm -rfq --cached .
          git add -f shots
          git commit -qm shots
          git push -f origin capturas-out
